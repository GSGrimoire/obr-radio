<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="console">
<header class="c-head">
  <h1 class="plate">GS Grimoire Radio</h1>
  <span id="c-conn" class="pill">Connecting…</span>
  <span id="c-dnm" class="pill subtle" hidden>D&amp;M</span>
  <span class="spacer"></span>
  <span id="c-version" class="muted"></span>
</header>

<div id="c-nobar" class="card" hidden>
  <p id="c-nobar-text"></p>
  <button id="c-open-bar" class="primary" hidden>Open the radio</button>
</div>

<div id="c-toast" class="toast" role="status" hidden></div>

<nav id="c-tabs" class="tabs" hidden>
  <button data-tab="play" class="on">Play</button>
  <button data-tab="library">Library</button>
  <button data-tab="reactions">Reactions</button>
  <button data-tab="settings">Settings</button>
</nav>

<main id="c-main">
  <!-- Everyone: what is playing, and your own volume -->
  <section id="c-me" class="card">
    <div class="me-now">
      <div id="c-me-record" class="record" aria-hidden="true"><div class="label"></div></div>
      <div>
        <div class="muted small">Now playing</div>
        <div id="c-now-title" class="now-title">Nothing playing</div>
        <div id="c-now-sub" class="muted"></div>
      </div>
    </div>
    <div class="sliders">
      <span class="sec-title" style="margin:0">Your volume</span>
      <span class="kn"><span class="knob" data-knob><svg width="52" height="52" viewBox="0 0 56 56" aria-hidden="true"><path d="M9.6 46.4 A26 26 0 1 1 46.4 46.4" fill="none" stroke="#e8dcbf" stroke-width="2" stroke-dasharray="1.5 4.2"/><circle cx="28" cy="28" r="20" fill="#2a120c" stroke="#6b4c1c" stroke-width="1.5"/><circle class="cap" cx="28" cy="28" r="16" fill="#b8903f" stroke="#6b4c1c"/><circle cx="24" cy="23" r="6" fill="#f2d88f" opacity=".35"/><g class="pointer"><line x1="28" y1="27" x2="28" y2="14" stroke="#22110b" stroke-width="3" stroke-linecap="round"/></g></svg><input type="range" id="c-v-music" min="0" max="100" aria-label="Music, for you"></span>Music</span>
      <span class="kn"><span class="knob" data-knob><svg width="52" height="52" viewBox="0 0 56 56" aria-hidden="true"><path d="M9.6 46.4 A26 26 0 1 1 46.4 46.4" fill="none" stroke="#e8dcbf" stroke-width="2" stroke-dasharray="1.5 4.2"/><circle cx="28" cy="28" r="20" fill="#2a120c" stroke="#6b4c1c" stroke-width="1.5"/><circle class="cap" cx="28" cy="28" r="16" fill="#b8903f" stroke="#6b4c1c"/><circle cx="24" cy="23" r="6" fill="#f2d88f" opacity=".35"/><g class="pointer"><line x1="28" y1="27" x2="28" y2="14" stroke="#22110b" stroke-width="3" stroke-linecap="round"/></g></svg><input type="range" id="c-v-amb" min="0" max="100" aria-label="Ambience, for you"></span>Ambience</span>
      <span class="kn"><span class="knob" data-knob><svg width="52" height="52" viewBox="0 0 56 56" aria-hidden="true"><path d="M9.6 46.4 A26 26 0 1 1 46.4 46.4" fill="none" stroke="#e8dcbf" stroke-width="2" stroke-dasharray="1.5 4.2"/><circle cx="28" cy="28" r="20" fill="#2a120c" stroke="#6b4c1c" stroke-width="1.5"/><circle class="cap" cx="28" cy="28" r="16" fill="#b8903f" stroke="#6b4c1c"/><circle cx="24" cy="23" r="6" fill="#f2d88f" opacity=".35"/><g class="pointer"><line x1="28" y1="27" x2="28" y2="14" stroke="#22110b" stroke-width="3" stroke-linecap="round"/></g></svg><input type="range" id="c-v-fx" min="0" max="100" aria-label="Sounds, for you"></span>Sounds</span>
      <button id="c-mute" class="mute-switch" aria-pressed="false"><span>Mute</span><span class="track"><span class="lever"></span></span></button>
    </div>
    <p class="muted small me-note">Your volume, for you only. Drag across a knob, or use the arrow keys. The sound plays in the radio bar at the edge of the map — keep it open.</p>
  </section>

  <div class="tab" data-panel="play">
    <div class="search" id="c-searchbar">
      <input type="search" id="c-search" placeholder="Find a sound, a layer or a scene" aria-label="Find a sound, a layer or a scene" autocomplete="off">
      <span class="hint">/ to search · Enter plays</span>
    </div>
    <section class="well platter" id="c-music"></section>
    <section class="channels" id="c-amb"></section>
    <section class="shelf" id="c-scenes"></section>
    <section class="drawer" id="c-board"></section>
    <!-- Players: the pads the GM opened to them -->
    <section class="card" id="c-ppads" hidden></section>
  </div>

  <div class="tab" data-panel="library" hidden>
    <div class="lib-search">
      <input type="search" id="c-lib-search" placeholder="Find in your library" aria-label="Find in your library" autocomplete="off">
    </div>
    <section class="card" id="c-packs"></section>
    <section class="card" id="c-lists"></section>
    <section class="card" id="c-sounds"></section>
    <section class="card" id="c-scene-list"></section>
  </div>

  <div class="tab" data-panel="reactions" hidden>
    <section class="card" id="c-obrscene"></section>
    <section class="card" id="c-react"></section>
  </div>

  <div class="tab" data-panel="settings" hidden>
    <section class="card" id="c-settings"></section>
    <section class="card" id="c-backup"></section>
  </div>
</main>
<script type="module" src="console.js"></script>
</body>
</html>
