<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bar">
<div class="bar-row">
  <div class="now">
    <div id="title" class="now-title">Nothing playing</div>
    <div id="label" class="now-label"></div>
  </div>
  <div class="gm-only transport">
    <button id="prev" title="Previous">⏮</button>
    <button id="toggle" title="Play / pause">▶</button>
    <button id="next" title="Next">⏭</button>
  </div>
  <button id="move" class="ghost" title="Move to the next corner">⇲</button>
  <button id="close" class="ghost" title="Close the radio (the music stops for you)">×</button>
</div>
<div class="bar-row small">
  <button id="tune" class="tune" title="Your browser needs one press before it will play sound">▶ Tune in</button>
  <label class="vol" title="Music volume, for you only">♪ <input type="range" id="vol-music" min="0" max="100"></label>
  <label class="vol" title="Sound-effect volume, for you only">✦ <input type="range" id="vol-fx" min="0" max="100"></label>
  <span id="status" class="status" role="status"></span>
</div>
<div id="yt-wrap" class="yt-wrap"><div id="yt"></div></div>
<audio id="music" preload="auto"></audio>
<audio id="fx" preload="auto"></audio>
<script type="module" src="bar.js"></script>
</body>
</html>
