<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bar">
<div class="bar-row">
  <div class="now">
    <div id="title" class="now-title">Nothing playing</div>
    <div id="label" class="now-label"></div>
  </div>
  <div class="gm-only transport">
    <button id="prev" title="Previous track" aria-label="Previous track">⏮</button>
    <button id="toggle" title="Play or pause the music" aria-label="Play or pause">▶</button>
    <button id="next" title="Next track" aria-label="Next track">⏭</button>
  </div>
  <button id="mute" class="ghost" title="Mute the radio, for you only" aria-label="Mute" aria-pressed="false">🔊</button>
  <button id="popout" class="ghost gm-only-inline" title="Open the radio console in its own window" aria-label="Open console window">⧉</button>
  <button id="move" class="ghost" title="Move to the next corner" aria-label="Move">⇲</button>
  <button id="close" class="ghost" title="Close the radio (the sound stops for you)" aria-label="Close">×</button>
</div>
<div class="bar-row small">
  <button id="tune" class="tune" title="Your browser needs one press before it will play sound">▶ Tune in</button>
  <span id="status" class="status" role="status"></span>
</div>
<div id="embeds" class="embeds"></div>
<div id="media" hidden></div>
<script type="module" src="bar.js"></script>
</body>
</html>
